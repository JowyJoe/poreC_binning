[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "porebin"
version = "0.1.0"
description = "Hypergraph-preserving metagenome binning from Nanopore Pore-C multi-way contacts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "porebin contributors" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyarrow>=14.0",
  "python-igraph>=0.11.4",
  "leidenalg>=0.10.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
bam = [
  "pysam>=0.22",
]
spectral = [
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "hdbscan>=0.8",
]

[project.scripts]
porebin = "porebin.cli:app"

[tool.setuptools.packages.find]
include = ["porebin*"]

[tool.setuptools.package-data]
porebin = ["scg_db/*.json", "scg_db/*.hmm", "scg_db/*.tsv", "scg_db/*.txt"]
