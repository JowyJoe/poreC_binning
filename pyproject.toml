[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "porebin"
version = "0.1.0"
description = "Genome-centric Pore-C metagenomic binning with contact evidence, sequence composition, and coverage"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "porebin contributors" }]
dependencies = [
  "typer>=0.12",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
bam = [
  "pysam>=0.22",
]
refine = [
  "igraph>=1.0",
  "leidenalg>=0.11",
]
spectral = [
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "hdbscan>=0.8",
]

[project.scripts]
porebin = "porebin_genome.cli:app"
porebin-genome = "porebin_genome.cli:app"

[tool.setuptools.packages.find]
include = ["porebin_genome*"]
