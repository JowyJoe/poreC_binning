[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergraph-binning"
version = "0.1.2"
description = "Hypergraph spectral binning (single-source Pore-C)"
authors = [{name = "Researcher"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pysam>=0.22",
  "pandas>=2.0",
  "typer>=0.9",
  "tqdm>=4.64",
  "biopython>=1.81",
  "pyyaml>=6.0",
]

[project.scripts]
hgbin = "hypergraph_binning.cli:app"
