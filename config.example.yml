inputs:
  contigs_fasta: /data/caojiawei/fastFile/poreAll.fasta
  porec_bam: /data/caojiawei/fastFile/poreAll.nsort.bam
outputs:
  output_dir: /data/caojiawei/fastFile/HyBins
filters:
  mapq_min: 20
  segment_min_bases: 500
  min_segments_per_read: 2
  max_hyperedge_size: 20
spectral:
  k: 0        # 0 表示自动选择k；若想固定k，填正整数

# Multiplex options (HyperBin-X)
multiplex:
  beta: 0.5       # Coupling strength between physical and chemical layers
